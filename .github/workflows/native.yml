# Builds the native app (native/, Rust + Tauri 2) for macOS, Windows and Linux and keeps the installers as run
# artifacts: a universal .dmg for Apple silicon and Intel Macs, an .msi and setup .exe, a .deb and an .AppImage.
#
# The macOS build is signed ad hoc (no Developer ID yet): after the first download macOS asks to confirm the app in
# System Settings → Privacy & Security → Open Anyway, or run `xattr -dr com.apple.quarantine /Applications/Harnessly.app`.
name: native

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["native/**", ".github/workflows/native.yml"]
  pull_request:
    paths: ["native/**", ".github/workflows/native.yml"]

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Tests
        working-directory: native
        run: cargo test --locked

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-universal
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
            out: native/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            name: windows-x64
            targets: ""
            args: --bundles msi,nsis
            out: |
              native/target/release/bundle/msi/*.msi
              native/target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            name: linux-x64
            targets: ""
            args: --bundles deb,appimage
            out: |
              native/target/release/bundle/deb/*.deb
              native/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Rust targets
        if: matrix.targets != ''
        shell: bash
        run: rustup target add ${MATRIX_TARGETS//,/ }
        env:
          MATRIX_TARGETS: ${{ matrix.targets }}
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build
        working-directory: native
        run: cargo tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v7
        with:
          name: harnessly-${{ matrix.name }}
          path: ${{ matrix.out }}
          if-no-files-found: error
